name: "Phase-Barrier Gate"
description: "Stage gate for coding agents: enforce the engineer SOP (spec -> tests -> implementation -> tests -> delivery) and fail CI when the expected stage is not reached."
author: "Xuqing0415"
branding:
  icon: "shield"
  color: "blue"

outputs:
  workspace:
    description: "Workspace path checked by the gate (mirrors inputs.workspace); reusable by downstream steps."
    value: ${{ steps.gate.outputs.workspace }}
  stage:
    description: "Stage number: current stage for inspect, inputs.stage for check, target --to for advance; empty in exec mode."
    value: ${{ steps.gate.outputs.stage }}
  allowed:
    description: "Whether the gate passed / execution is allowed (true/false); always false on failure."
    value: ${{ steps.gate.outputs.allowed }}

inputs:
  workspace:
    description: "Workspace path relative to the repository root."
    required: false
    default: "."
  config:
    description: "Optional phase-barrier YAML configuration file path."
    required: false
    default: ""
  mode:
    description: "Gate mode: inspect / advance / exec / check / verify (details in docs/github-action.md)."
    required: false
    default: "inspect"
  expected_stage:
    description: "Expected stage (0-6) that must be reached in inspect mode."
    required: false
    default: "6"
  to:
    description: "Target stage for advance mode (must equal current stage + 1)."
    required: false
    default: ""
  stage:
    description: "Stage number (0-6) to validate in check mode (v0.22.0)."
    required: false
    default: ""
  user_request:
    description: "Optional original user request recorded when advance initializes the workspace."
    required: false
    default: ""
  command:
    description: "Test / validation command for exec mode (required when mode=exec)."
    required: false
    default: ""
  cwd:
    description: "Working directory for exec mode, relative to workspace (optional)."
    required: false
    default: ""
  git_base:
    description: "Git base ref for verify mode (e.g. origin/main or github.event.pull_request.base.sha); required when mode=verify (v0.26.0)."
    required: false
    default: "${{ github.event.pull_request.base.sha }}"
  version:
    description: "phase-barrier version to install (empty = latest release)."
    required: false
    default: ""
  local:
    description: "Install from the local repository instead of PyPI (CI self-test only)."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install phase-barrier
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ "${{ inputs.local }}" == "true" ]; then
          pip install .
        elif [ -n "${{ inputs.version }}" ]; then
          pip install "phase-barrier==${{ inputs.version }}"
        else
          pip install --upgrade phase-barrier
        fi

    - name: Run phase-barrier gate
      id: gate
      shell: bash
      run: |
        set -euo pipefail
        WS="${{ inputs.workspace }}"
        MODE="${{ inputs.mode }}"
        echo "workspace=$WS" >> "$GITHUB_OUTPUT"
        echo "allowed=false" >> "$GITHUB_OUTPUT"
        if [ "$MODE" != "inspect" ] && [ "$MODE" != "advance" ] && [ "$MODE" != "exec" ] && [ "$MODE" != "check" ] && [ "$MODE" != "verify" ]; then
          echo "::error::mode 必须是 inspect / advance / exec / check / verify，当前值: $MODE"
          exit 1
        fi
        if [ ! -d "$WS" ]; then
          echo "::error::workspace 不存在或不是目录: $WS"
          exit 1
        fi
        EXPECTED="${{ inputs.expected_stage }}"
        case "$EXPECTED" in
          ''|*[!0-9]*)
            echo "::error::expected_stage 必须是 0-6 的整数，当前值: $EXPECTED"
            exit 1 ;;
        esac
        EXPECTED=$((10#$EXPECTED))
        if [ "$EXPECTED" -lt 0 ] || [ "$EXPECTED" -gt 6 ]; then
          echo "::error::expected_stage 超出范围（0-6），当前值: ${{ inputs.expected_stage }}"
          exit 1
        fi
        if [ "$MODE" == "advance" ]; then
          TO="${{ inputs.to }}"
          if [ -z "$TO" ]; then
            echo "::error::advance 模式必须提供 to（目标阶段）"
            exit 1
          fi
          case "$TO" in
            ''|*[!0-9]*)
              echo "::error::to 必须是 0-6 的整数，当前值: $TO"
              exit 1 ;;
          esac
          TO=$((10#$TO))
          if [ "$TO" -lt 0 ] || [ "$TO" -gt 6 ]; then
            echo "::error::to 超出范围（0-6），当前值: ${{ inputs.to }}"
            exit 1
          fi
        fi
        CONFIG_ARGS=()
        if [ -n "${{ inputs.config }}" ]; then
          CONFIG_ARGS+=(--config "${{ inputs.config }}")
        fi

        if [ "$MODE" == "exec" ]; then
          COMMAND="${{ inputs.command }}"
          if [ -z "$COMMAND" ]; then
            echo "::error::exec 模式必须提供 command"
            exit 1
          fi
          # CLI exec 退出码：0=放行且命令成功；非 0=命令失败或门禁拒绝，set -e 直接失败
          CWD_ARGS=()
          if [ -n "${{ inputs.cwd }}" ]; then
            CWD_ARGS+=(--cwd "${{ inputs.cwd }}")
          fi
          python -m anti_shortcut exec --workspace "$WS" --command "$COMMAND" "${CONFIG_ARGS[@]}" "${CWD_ARGS[@]}"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "phase-barrier 门禁执行通过：$COMMAND"
        elif [ "$MODE" == "check" ]; then
          STAGE="${{ inputs.stage }}"
          if [ -z "$STAGE" ]; then
            echo "::error::check 模式必须提供 stage（0-6）"
            exit 1
          fi
          case "$STAGE" in
            ''|*[!0-9]*)
              echo "::error::stage 必须是 0-6 的整数，当前值: $STAGE"
              exit 1 ;;
          esac
          STAGE=$((10#$STAGE))
          if [ "$STAGE" -lt 0 ] || [ "$STAGE" -gt 6 ]; then
            echo "::error::stage 必须在 0-6 之间，当前值: ${{ inputs.stage }}"
            exit 1
          fi
          python -m anti_shortcut check --workspace "$WS" --stage "${{ inputs.stage }}" --json "${CONFIG_ARGS[@]}" > /tmp/phase-barrier-check.json || {
            echo "::error::phase-barrier 门禁未通过：不得进入阶段 ${{ inputs.stage }}（前置证据不足）"
            cat /tmp/phase-barrier-check.json
            exit 1
          }
          ALLOWED=$(python -c "import json; print(json.load(open('/tmp/phase-barrier-check.json'))['allowed'])")
          if [ "$ALLOWED" != "True" ]; then
            echo "::error::phase-barrier 门禁未通过：不得进入阶段 ${{ inputs.stage }}（前置证据不足）"
            cat /tmp/phase-barrier-check.json
            exit 1
          fi
          echo "stage=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "phase-barrier 门禁通过：放行进入阶段 ${{ inputs.stage }}"
        elif [ "$MODE" == "verify" ]; then
          GB="${{ inputs.git_base }}"
          if [ -z "$GB" ]; then
            echo "::error::verify 模式必须提供 git_base（PR 基线 ref，如 origin/main 或 pull_request.base.sha）"
            exit 1
          fi
          python -m anti_shortcut verify-evidence --workspace "$WS" --git-base "$GB" --json "${CONFIG_ARGS[@]}" > /tmp/phase-barrier-verify.json || {
            echo "::error::phase-barrier 证据校验未通过（证据文件被修改 / 清单损坏 / git 基线不可用）"
            cat /tmp/phase-barrier-verify.json
            exit 1
          }
          echo "stage=" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "phase-barrier 证据校验通过（git 基线 $GB）"
        elif [ "$MODE" == "advance" ]; then
          USER_ARGS=()
          if [ -n "${{ inputs.user_request }}" ]; then
            USER_ARGS+=(--user-request "${{ inputs.user_request }}")
          fi
          python -m anti_shortcut advance --workspace "$WS" --to "${{ inputs.to }}" "${CONFIG_ARGS[@]}" "${USER_ARGS[@]}"
          echo "stage=${{ inputs.to }}" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
        else
          python -m anti_shortcut inspect --workspace "$WS" --json "${CONFIG_ARGS[@]}" > /tmp/phase-barrier-gate.json
          STAGE=$(python -c "import json; print(json.load(open('/tmp/phase-barrier-gate.json'))['current_stage'])")
          if [ "$STAGE" -lt "$EXPECTED" ]; then
            echo "::error::phase-barrier 门禁未通过：当前阶段 $STAGE < 期望阶段 $EXPECTED（Agent 产出未按 SOP 完成）"
            cat /tmp/phase-barrier-gate.json
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "phase-barrier 门禁通过：当前阶段 $STAGE >= 期望阶段 $EXPECTED"
        fi
