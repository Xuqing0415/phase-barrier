# v0.47.0: 插件索引自动发现 + 增量刷新 + 自动验证（plugins.json 驱动）
# 每周一 03:00 UTC + 手动触发（与 plugin-check.yml 周一 06:00 错开）。
# 第一步 auto_discover_plugins.py：按 GitHub topic 搜索第三方仓库，过滤已收录
# 条目，对候选执行 clone -> pip install -e -> plugin-verify，通过则以
# auto_discovered: true 收录并同步 docs/plugin-status.md（--update）；对已收录
# 自动条目的新提交（git ls-remote 与 last_commit_sha 不一致）做增量刷新。
# 第二步 verify_plugins.py：安装索引全部条目并运行 plugin-verify（子进程），
# 把最新 status / last_verified 写回 plugins.json，并把状态表同步到
# docs/plugin-status.md 插件状态页（--update --sync-docs）；有变更则推分支并开 PR，
# 由人工合并（不再由机器人直接提交到 main），验证报告作为 artifact 上传。
# GitHub Search 使用仓库内置 GITHUB_TOKEN。
name: Plugin Verification and Discovery

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plugin-verification
  cancel-in-progress: false

jobs:
  verify-index:
    name: Verify indexed plugins from plugins.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install phase-barrier and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Auto-discover third-party plugins from GitHub topic
        id: discover
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/auto_discover_plugins.py --update --json > plugin-discovery-report.json
          rc=$?
          set -e
          echo "discover_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "scripts/auto_discover_plugins.py exit code: ${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::GitHub Search API 调用失败，本次跳过自动发现（不影响后续索引验证）"
          fi

      - name: Verify indexed plugins and update plugins.json
        id: verify
        continue-on-error: true
        run: |
          set +e
          python scripts/verify_plugins.py --update --sync-docs --json > plugin-verification-report.json
          rc=$?
          set -e
          echo "verify_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "scripts/verify_plugins.py exit code: ${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::plugins.json 存在验证失败的条目，详见报告 artifact / 自动提交"
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verification-report
          path: |
            plugin-verification-report.json
            plugin-discovery-report.json
          if-no-files-found: error

      - name: Open PR with updated plugin status
        # 只允许默认分支的定时运行改索引：schedule 始终在默认分支（main）运行，但
        # workflow_dispatch 可从任意分支手动触发——此时若直接 push HEAD:main，
        # 会把该分支的 plugins.json / 状态页内容误推到 main。
        #
        # 改为「推分支 + 开 PR」，不再由机器人直接 push main：直接提交会让
        # github-actions[bot] 永久计入仓库贡献者，并每周产生一次无人审核的主分支提交。
        # 分支提交统一使用维护者身份（GitHub noreply 邮箱，与账号绑定），
        # 无论 merge commit 还是 squash 合并，作者都会归到 Xuqing0415 名下。
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Xuqing0415"
          git config user.email "248270291+Xuqing0415@users.noreply.github.com"
          git add plugins.json docs/plugin-status.md docs/plugins.md
          if git diff --cached --quiet; then
            echo "plugins.json 无变更，跳过"
            exit 0
          fi
          branch="plugin-status/${{ github.run_id }}"
          base="${{ github.event.repository.default_branch }}"
          git checkout -b "$branch"
          git commit -m "chore: update plugin verification status"
          git push -u origin "$branch"
          if gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "chore: 插件验证状态更新（$(date -u +%Y-%m-%d)）" \
              --body "由 plugin-verification workflow 自动生成：刷新 plugins.json 的 status / last_verified，并同步 docs/plugin-status.md 与 docs/plugins.md。"; then
            exit 0
          fi
          echo "::warning::自动建 PR 失败（分支 $branch 已推送）。若报 createPullRequest 权限问题，请在 Settings → Actions → General → Workflow permissions 勾选 Allow GitHub Actions to create and approve pull requests 后重跑。"
          echo "手动创建：https://github.com/${GITHUB_REPOSITORY}/compare/${base}...${branch}?expand=1"
