name: 功能建议（Feature Request）
description: 提议新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 使用场景与痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 功能设计、CLI / 配置 / API 变更草案
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 备选方案
      description: 其他思路（可选）
  - type: checkboxes
    id: terms
    attributes:
      label: 自查
      options:
        - label: 我已阅读贡献指南（CONTRIBUTING.md）与 Roadmap
          required: true
