name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # v0.16.0: 安装真实工具链，激活 JS/Go/Rust/Ruby 适配器的真实工具测试
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Run end-to-end demo
        run: |
          python examples/demo.py
          python examples/orchestrator_hooks/demo.py
          python examples/orchestrator_hooks/multi_agent.py

      - name: Smoke-test CLI entry point
        run: |
          anti-shortcut --version
          anti-shortcut inspect --json

  coverage:
    name: coverage (fail-under 90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # v0.16.0: 覆盖率门禁需要与主测试矩阵一致的真实工具链
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run suite with coverage (self dogfooding)
        run: |
          coverage run -m pytest
          coverage report --fail-under=90
          coverage json -o coverage.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.json
          if-no-files-found: error

  gate-action:
    name: GitHub Action gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # verify 模式需要 git 基线历史

      - name: Prepare demo workspace (fresh -> stage 1)
        shell: bash
        run: |
          mkdir -p ci_gate_ws
          cat > ci_gate_ws/spec.md <<'EOF'
          # Demo
          ## 需求分析
          实现一个加法函数 add(a, b)，返回两个整数之和；对负数输入抛出异常，
          对非整数输入返回类型错误提示。
          ## 设计方案
          采用纯函数实现：先校验参数类型与取值范围，再返回 a + b；
          不读写外部状态，无任何副作用，便于单元测试覆盖。
          ## 接口定义
          def add(a: int, b: int) -> int
          EOF

      - name: Gate passes at expected_stage=1
        id: gate
        uses: ./
        with:
          workspace: ci_gate_ws
          expected_stage: 1
          local: "true"

      - name: Assert inspect outputs
        run: |
          [ "${{ steps.gate.outputs.workspace }}" == "ci_gate_ws" ]
          [ "${{ steps.gate.outputs.stage }}" == "1" ]
          [ "${{ steps.gate.outputs.allowed }}" == "true" ]

      - name: Gate should fail at expected_stage=6
        id: gate_fail
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          expected_stage: 6
          local: "true"

      - name: Assert gate failed as expected
        if: steps.gate_fail.outcome == 'success'
        run: |
          echo "::error::phase-barrier 门禁应失败但通过了"
          exit 1

      - name: Gate check mode allows entering stage 2 (spec done)
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: check
          stage: 2
          local: "true"

      - name: Gate check mode denies entering stage 6 (evidence missing)
        id: gate_check_fail
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: check
          stage: 6
          local: "true"

      - name: Assert check mode failed as expected
        if: steps.gate_check_fail.outcome == 'success'
        run: |
          echo "::error::phase-barrier check 门禁应失败但通过了"
          exit 1

      - name: Gate check mode rejects missing stage
        id: gate_check_missing_stage
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: check
          local: "true"

      - name: Assert missing stage failed as expected
        if: steps.gate_check_missing_stage.outcome == 'success'
        run: |
          echo "::error::phase-barrier check 缺少 stage 应失败但通过了"
          exit 1

      - name: Gate advance mode advances stage (spec -> 2)
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: advance
          to: 2
          local: "true"

      - name: Install pytest for exec mode self-test
        shell: bash
        run: python -m pip install pytest

      - name: Prepare tests and implementation for exec mode
        shell: bash
        run: |
          cat > ci_gate_ws/test_add.py <<'EOF'
          import pytest
          from add import add

          def test_add():
              assert add(1, 2) == 3

          def test_add_negative():
              with pytest.raises(ValueError):
                  add(-1, 1)
          EOF
          cat > ci_gate_ws/add.py <<'EOF'
          def add(a, b):
              if a < 0 or b < 0:
                  raise ValueError("negative")
              return a + b
          EOF

      - name: Gate advance to stage 3 (tests)
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: advance
          to: 3
          local: "true"

      - name: Gate advance to stage 4 (implementation)
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: advance
          to: 4
          local: "true"

      - name: Gate verify mode passes when evidence untouched
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: verify
          git_base: HEAD~1
          local: "true"

      - name: Gate verify mode rejects invalid git_base
        id: gate_verify_bad
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: verify
          git_base: no_such_ref_for_gate_self_test
          local: "true"

      - name: Assert invalid git_base failed as expected
        if: steps.gate_verify_bad.outcome == 'success'
        run: |
          echo "::error::phase-barrier verify 非法 git_base 应失败但通过了"
          exit 1

      - name: Gate exec mode runs test command (passes)
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: exec
          command: python -m pytest test_add.py -q
          local: "true"

      - name: Gate exec mode fails when command fails
        id: gate_exec_fail
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: exec
          command: python -c "import sys; sys.exit(5)"
          local: "true"

      - name: Assert failing exec command failed as expected
        if: steps.gate_exec_fail.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应因命令失败而失败但通过了"
          exit 1

      - name: Gate exec mode rejects missing command
        id: gate_bad_command
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: exec
          local: "true"

      - name: Assert missing command failed as expected
        if: steps.gate_bad_command.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应拒绝 exec 模式缺 command 但通过了"
          exit 1

      - name: Gate rejects invalid mode
        id: gate_bad_mode
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: bogus
          local: "true"

      - name: Assert invalid mode failed as expected
        if: steps.gate_bad_mode.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应拒绝非法 mode 但通过了"
          exit 1

      - name: Gate rejects invalid expected_stage
        id: gate_bad_stage
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          expected_stage: abc
          local: "true"

      - name: Assert invalid expected_stage failed as expected
        if: steps.gate_bad_stage.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应拒绝非法 expected_stage 但通过了"
          exit 1

      - name: Gate rejects missing workspace
        id: gate_bad_ws
        continue-on-error: true
        uses: ./
        with:
          workspace: no_such_dir
          local: "true"

      - name: Assert missing workspace failed as expected
        if: steps.gate_bad_ws.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应拒绝缺失工作区但通过了"
          exit 1

  e2e-kind:
    name: K8s Helm e2e (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - name: Install kind
        run: |
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install kubectl
        run: |
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Run Helm + kind end-to-end test
        run: bash deploy/k8s/kind-e2e-test.sh

  bench:
    name: Performance benchmark (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run performance benchmark
        run: |
          python benchmarks/bench.py --fail-fast \
            --state-threads 32 --state-iters 8 \
            --write-ops 100 --exec-ops 20 \
            --state-p95-ms 2000 --write-p95-ms 5000 --exec-p95-ms 10000

  package:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build frontend
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions (metadata + README)
        run: twine check dist/*

      - name: List artifacts
        run: ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
