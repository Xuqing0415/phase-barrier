# v0.45.0: 插件索引自动验证（plugins.json 驱动）
# 每周二 05:00 UTC + 手动触发（与 plugin-check.yml 周一 06:00 错开）。
# 读取 plugins.json，安装索引条目并运行 plugin-verify（子进程），把最新
# status / last_verified 写回 plugins.json；有变更则自动提交到 main，
# 验证报告作为 artifact 上传。第三方插件仓库仍由其自带 Plugin CI 验证。
name: Plugin Verification

on:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-verification
  cancel-in-progress: false

jobs:
  verify-index:
    name: Verify indexed plugins from plugins.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install phase-barrier and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify indexed plugins and update plugins.json
        id: verify
        continue-on-error: true
        run: |
          set +e
          python scripts/verify_plugins.py --update --json > plugin-verification-report.json
          rc=$?
          set -e
          echo "verify_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "scripts/verify_plugins.py exit code: ${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::plugins.json 存在验证失败的条目，详见报告 artifact / 自动提交"
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verification-report
          path: plugin-verification-report.json
          if-no-files-found: error

      - name: Commit updated plugins.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          if git diff --cached --quiet; then
            echo "plugins.json 无变更，跳过提交"
          else
            git commit -m "chore: update plugin verification status [skip ci]"
            git push origin HEAD:main
          fi
