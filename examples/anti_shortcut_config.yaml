# 反捷径校验 Skill 示例配置（可选，缺失时使用默认值）
# 加载方式：
#   skill = AntiShortcutSkill(workspace=".", config="anti_shortcut_config.yaml", user_request=...)

# 门禁目录与状态文件
gate_dir_name: ".agent_gate"
state_file_name: "state.json"
audit_log_name: "audit.log"

# ---- 阶段 1：Spec 设计 ----
spec_file: "spec.md"
spec_sections:
  - "## 需求分析"
  - "## 设计方案"
  - "## 接口定义"
spec_min_chars: 120

# ---- 阶段 2：测试用例 ----
test_file_patterns:
  - "test_*.py"
  - "*_test.py"
  - "tests/**/test_*.py"
  - "tests/**/*_test.py"
min_test_functions: 2
require_assert_per_test: true

# ---- 阶段 3：实现代码 ----
source_file_patterns:
  - "*.py"
require_implementation: true

# ---- 阶段 4/5：测试运行 ----
# 测试命令正则（匹配命令前缀），可按语言扩展
test_commands:
  - '^\s*python3?\s+(-m\s+)?pytest\b'
  - '^\s*pytest\b'
  - '^\s*python3?\s+-m\s+unittest\b'
  - '^\s*npm\s+test\b'
  - '^\s*npx\s+(jest|vitest|mocha|playwright)\b'
  - '^\s*(go|rust)\s+test\b'
  - '^\s*cargo\s+test\b'
  - '^\s*gradle\s+test\b'
  - '^\s*mvn\s+test\b'
  - '^\s*tox\b'
max_test_output_tail: 4000

# ---- 安全 ----
# 是否启用门禁目录防护提示（生产环境请配合只读卷挂载）
protect_gate_dir: true
# 是否允许 Agent 在任意阶段写入“其他”类型文件（README、docs 等）
allow_other_files_any_stage: true

# ---- 状态签名与密钥轮换（v0.8.0 / v0.9.0）----
# HMAC-SHA256 状态签名密钥；未设置时回退环境变量 PHASE_BARRIER_HMAC_KEY
# state_hmac_key: "change-me"
# 轮换期接受的旧密钥列表（仅用于验证；签名始终使用 state_hmac_key），
# 也可用环境变量 PHASE_BARRIER_HMAC_KEYS（逗号 / 空白分隔）
# state_hmac_keys: []

# ---- 证据签名（v0.9.0）----
# 阶段推进时把证据文件哈希写入 .agent_gate/evidence_manifest.json（可选 HMAC 签名），
# 交付 / CI 可用 `python -m anti_shortcut verify-evidence --workspace .` 事后比对
# evidence_signing: true

# ---- 审计远程推送（v0.9.0）----
# 设置后审计事件异步 POST 到 SIEM / webhook（单事件为对象，多事件为 JSON 数组），
# 队列有界、失败只计数，不影响门禁执行
# audit_remote_url: "https://siem.example.com/ingest"
# audit_remote_token: ""
# audit_remote_timeout: 5.0
# audit_remote_batch_size: 50
# audit_remote_max_queue: 1000
# audit_remote_flush_interval: 5.0
# audit_remote_retries: 2            # v0.10.0：发送失败重试次数（指数退避）
# audit_remote_backoff_factor: 0.5   # v0.10.0：退避基数秒（0.5→1→2…）
# audit_remote_ca_bundle: ""         # v0.10.0：自建 SIEM TLS 的自定义 CA（PEM 路径）

# 更严格的项目还可以这样配：
#   min_test_functions: 5
#   spec_sections: ["## 需求分析", "## 设计方案", "## 接口定义", "## 验收标准"]
#   require_assert_per_test: true
