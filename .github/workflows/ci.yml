name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Run end-to-end demo
        run: python examples/demo.py

      - name: Smoke-test CLI entry point
        run: |
          anti-shortcut --version
          anti-shortcut inspect --json

  gate-action:
    name: GitHub Action gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare demo workspace (fresh -> stage 1)
        shell: bash
        run: |
          mkdir -p ci_gate_ws
          cat > ci_gate_ws/spec.md <<'EOF'
          # Demo
          ## 需求分析
          实现一个加法函数 add(a, b)，返回两数之和。
          ## 设计方案
          纯函数实现，参数校验非空。
          ## 接口定义
          int add(int a, int b)
          EOF

      - name: Gate passes at expected_stage=1
        uses: ./
        with:
          workspace: ci_gate_ws
          expected_stage: 1
          local: "true"

      - name: Gate should fail at expected_stage=6
        id: gate_fail
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          expected_stage: 6
          local: "true"

      - name: Assert gate failed as expected
        if: steps.gate_fail.outcome == 'success'
        run: |
          echo "::error::phase-barrier 门禁应失败但通过了"
          exit 1

      - name: Gate advance mode advances stage (spec -> 2)
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: advance
          to: 2
          local: "true"

      - name: Gate rejects invalid mode
        id: gate_bad_mode
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          mode: bogus
          local: "true"

      - name: Assert invalid mode failed as expected
        if: steps.gate_bad_mode.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应拒绝非法 mode 但通过了"
          exit 1

      - name: Gate rejects invalid expected_stage
        id: gate_bad_stage
        continue-on-error: true
        uses: ./
        with:
          workspace: ci_gate_ws
          expected_stage: abc
          local: "true"

      - name: Assert invalid expected_stage failed as expected
        if: steps.gate_bad_stage.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应拒绝非法 expected_stage 但通过了"
          exit 1

      - name: Gate rejects missing workspace
        id: gate_bad_ws
        continue-on-error: true
        uses: ./
        with:
          workspace: no_such_dir
          local: "true"

      - name: Assert missing workspace failed as expected
        if: steps.gate_bad_ws.outcome == 'success'
        run: |
          echo "::error::phase-barrier 应拒绝缺失工作区但通过了"
          exit 1

  package:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build frontend
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions (metadata + README)
        run: twine check dist/*

      - name: List artifacts
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
