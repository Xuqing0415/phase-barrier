apiVersion: v1
kind: Service
metadata:
  name: {{ include "phase-barrier.fullname" . }}
  labels:
    {{- include "phase-barrier.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "phase-barrier.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.sidecar.port }}
