site_name: phase-barrier
site_description: 反捷径校验 Skill：阶段门禁 + 证据校验 + 工具拦截，强制编码 Agent 遵循标准工程师 SOP
site_url: https://xuqing0415.github.io/phase-barrier/
repo_url: https://github.com/Xuqing0415/phase-barrier
repo_name: Xuqing0415/phase-barrier
edit_uri: blob/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - navigation.tabs
    - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

exclude_docs: |
  blog/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 使用指南:
      - CLI 使用: usage.md
      - 配置指南: configuration.md
      - 语言适配器: languages.md
      - GitHub Action 门禁: github-action.md
      - GitHub Action 上架: publish-to-marketplace.md
      - 编排器钩子 SDK: orchestrator-hooks.md
      - 状态与审计: audit-logging.md
      - 拦截规则与安全加固: security-rules.md
      - 架构与设计: architecture.md
      - API 参考: api.md
  - 集成与生态:
      - Agent 框架集成: integrations.md
      - 插件与生态: plugins.md
      - 插件状态: plugin-status.md
      - K8s 部署: k8s.md
      - 最佳实践: best-practices.md
  - 教程:
      - CI 增量门禁: tutorials/ci-incremental-gate.md
      - K8s sidecar 加固与 gRPC 接口（v0.39.0 已实现）: tutorials/k8s-sidecar-grpc.md
      - SWE-bench 门禁基准: tutorials/swe-bench-gate.md
      - SWE-bench 真实评测 harness: tutorials/swe-bench-real.md
  - FAQ: faq.md
  - Roadmap: roadmap.md
  - 发布与供应链安全: release.md
  - 贡献指南: contributing.md
  - 更新日志: changelog.md
