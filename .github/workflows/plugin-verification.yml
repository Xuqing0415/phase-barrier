# v0.47.0: 插件索引自动发现 + 增量刷新 + 自动验证（plugins.json 驱动）
# 每周一 03:00 UTC + 手动触发（与 plugin-check.yml 周一 06:00 错开）。
# 第一步 auto_discover_plugins.py：按 GitHub topic 搜索第三方仓库，过滤已收录
# 条目，对候选执行 clone -> pip install -e -> plugin-verify，通过则以
# auto_discovered: true 收录并同步 docs/plugin-status.md（--update）；对已收录
# 自动条目的新提交（git ls-remote 与 last_commit_sha 不一致）做增量刷新。
# 第二步 verify_plugins.py：安装索引全部条目并运行 plugin-verify（子进程），
# 把最新 status / last_verified 写回 plugins.json，并把状态表同步到
# docs/plugin-status.md 插件状态页（--update --sync-docs）；有变更则自动提交到 main，
# 验证报告作为 artifact 上传。GitHub Search 使用仓库内置 GITHUB_TOKEN。
name: Plugin Verification and Discovery

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-verification
  cancel-in-progress: false

jobs:
  verify-index:
    name: Verify indexed plugins from plugins.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install phase-barrier and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Auto-discover third-party plugins from GitHub topic
        id: discover
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/auto_discover_plugins.py --update --json > plugin-discovery-report.json
          rc=$?
          set -e
          echo "discover_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "scripts/auto_discover_plugins.py exit code: ${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::GitHub Search API 调用失败，本次跳过自动发现（不影响后续索引验证）"
          fi

      - name: Verify indexed plugins and update plugins.json
        id: verify
        continue-on-error: true
        run: |
          set +e
          python scripts/verify_plugins.py --update --sync-docs --json > plugin-verification-report.json
          rc=$?
          set -e
          echo "verify_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "scripts/verify_plugins.py exit code: ${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::plugins.json 存在验证失败的条目，详见报告 artifact / 自动提交"
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verification-report
          path: |
            plugin-verification-report.json
            plugin-discovery-report.json
          if-no-files-found: error

      - name: Commit updated plugins.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json docs/plugin-status.md docs/plugins.md
          if git diff --cached --quiet; then
            echo "plugins.json 无变更，跳过提交"
          else
            git commit -m "chore: update plugin verification status [skip ci]"
            git push origin HEAD:main
          fi
