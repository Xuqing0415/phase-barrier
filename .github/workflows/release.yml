name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 需要创建 GitHub Release（Action Marketplace 自动上架）
  id-token: write   # sigstore 签名需要 GitHub OIDC token

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Sign artifacts with Sigstore (v0.10.0)
        # 用 GitHub OIDC 身份对 sdist / wheel 签名，生成 .sig / .bundle
        # 附件随 GitHub Release 发布，可用 cosign verify-blob 校验来源：
        #   cosign verify-blob --bundle <pkg>.whl.bundle \
        #     --certificate-identity-regexp 'https://github.com/Xuqing0415/phase-barrier/.github/workflows/release.yml@refs/tags/v' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <pkg>.whl
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Extract changelog section for release notes
        id: changelog
        shell: bash
        run: |
          python - "${{ github.ref_name }}" <<'PY'
          import re, sys
          tag = sys.argv[1]
          ver = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\].*?(?=^## \[|\Z)" % re.escape(ver), text, re.M | re.S)
          body = m.group(0).strip() if m else "Release %s（详见 CHANGELOG.md）" % tag
          open("release_body.md", "w", encoding="utf-8").write(body + "\n")
          print("extracted %d chars" % len(body))
          PY

      - name: Create GitHub Release (Action Marketplace auto-listing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: dist/*
