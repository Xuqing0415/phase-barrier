name: Red team

# 路径 1（v0.57.0）：用对抗性 Agent 打自己的门禁，出现未豁免逃逸即失败（v1.0.1 起）。
#
# 触发方式（P0 常态化，v0.60.0）：
# - pull_request：门禁核心代码（防线 / 拦截器 / 校验器 / 状态机 / 红队本体）变动时
#   自动跑**快速子集**，逃逸 -> job 失败 -> PR 不能合并；结果以评论形式贴回 PR；
# - schedule：每周一全量跑（含全部逃逸技术与多步 / 会话级 / 工具链攻击）；
# - workflow_dispatch：手动触发（full=false 只跑快速子集）。
on:
  push:
    branches: [main, master]
    paths:
      - 'anti_shortcut/control/**'
      - 'anti_shortcut/skill.py'
      - 'anti_shortcut/sidecar.py'
      - 'anti_shortcut/proxy*.py'
      - 'anti_shortcut/grpc_service.py'
      - 'benchmarks/control_red_team/**'
      - 'benchmarks/red_team/**'
      - 'tests/test_control*.py'
      - 'scripts/check_control_coverage.py'
      - '.github/workflows/red-team.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 是否全量（false 只跑快速子集）
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC
  pull_request:
    paths:
      - 'anti_shortcut/defense/**'
      - 'anti_shortcut/interceptors.py'
      - 'anti_shortcut/validators.py'
      - 'anti_shortcut/state.py'
      - 'anti_shortcut/skill.py'
      - 'anti_shortcut/control/**'
      - 'anti_shortcut/sidecar.py'
      - 'anti_shortcut/grpc_service.py'
      - 'anti_shortcut/proxy*.py'
      - 'benchmarks/red_team/**'
      - 'benchmarks/control_red_team/**'
      - 'tests/test_control*.py'
      - 'scripts/check_control_coverage.py'
      - 'docs/control-plane.md'
      - '.github/workflows/red-team.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: red-team-${{ github.ref }}
  cancel-in-progress: true

env:
  # PR 快速子集：覆盖防线 2/4/5 的核心绕过面，不需要大模型即可判定
  FAST_TECHNIQUES: 'equivalent_op,timing_evade,constraint_weaken,tool_chain_script,compact_redirection,control_bypass,task_state_skip,goal_binding_escape,break_glass_reuse,policy_fail_open'

jobs:
  control-security:
    name: Control security and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      # v0.16.0: 覆盖率门禁需要与主测试矩阵一致的真实工具链
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # v0.28.0: 安装 PHP，激活 PhpAdapter 真实工具测试（ubuntu 自带 gcc/g++）
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # v0.33.1: 安装 kotlinc（含 JDK 17），激活 KotlinAdapter 真实语法用例
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin compiler (kotlinc)
        run: |
          curl -fsSL -o /tmp/kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          sudo rm -rf /opt/kotlinc
          sudo unzip -q /tmp/kotlin-compiler.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
          /opt/kotlinc/bin/kotlinc -version
          /opt/kotlinc/bin/kotlinc -version 2>&1 | grep -q '2\.2\.0'
      # v0.34.0: 安装 .NET SDK 与 Scala 编译器，激活 CSharpAdapter / ScalaAdapter 真实工具用例
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install Scala compiler (scala-2.13.18)
        run: |
          curl -fsSL -o /tmp/scala.tgz \
            https://github.com/scala/scala/releases/download/v2.13.18/scala-2.13.18.tgz
          sudo rm -rf /opt/scala-2.13.18
          sudo tar -xzf /tmp/scala.tgz -C /opt
          echo "/opt/scala-2.13.18/bin" >> "$GITHUB_PATH"
          /opt/scala-2.13.18/bin/scalac -version
          /opt/scala-2.13.18/bin/scalac -version 2>&1 | grep -q '2\.13\.18'
      # v0.37.0: 安装 Swift 工具链（swift.org ubuntu24.04），激活 SwiftAdapter 真实语法用例
      - name: Install Swift toolchain (swift-6.1.2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libxml2-dev libz3-dev libedit2
          curl -fsSL -o /tmp/swift.tar.gz \
            https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz
          sudo mkdir -p /opt
          sudo rm -rf /opt/swift-6.1.2-RELEASE-ubuntu24.04
          sudo tar -xzf /tmp/swift.tar.gz -C /opt
          echo "/opt/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
          /opt/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin/swiftc -version
          /opt/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin/swiftc -version 2>&1 | grep -q '6\.1\.2'
      # v0.40.0: 安装 Dart SDK，激活 DartAdapter 真实语法/输出用例
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Show Dart SDK
        run: dart --version


      - name: Install security and optional UI dependencies
        run: python -m pip install -e '.[dev,tui]'
      - name: Run security regressions and measure the whole core
        run: |
          python -m coverage run --branch -m pytest tests/ -q -s --tb=short
          python -m coverage json -o control-coverage.json
          python scripts/check_control_coverage.py control-coverage.json
      - name: Run independent control adversarial techniques
        run: |
          python benchmarks/control_red_team/run_control_red_team.py --workspace "$RUNNER_TEMP/control-red-team" --output control-security-report --json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-security-evidence
          path: |
            control-coverage.json
            control-security-report/report.*
          if-no-files-found: warn
  red-team:
    name: 红队逃逸测试（fail-on-vulnerability）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Decide scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "techniques=${FAST_TECHNIQUES}" >> "$GITHUB_OUTPUT"
            echo "label=PR 快速子集（${FAST_TECHNIQUES}）" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "false" ]; then
            echo "techniques=${FAST_TECHNIQUES}" >> "$GITHUB_OUTPUT"
            echo "label=手动快速子集" >> "$GITHUB_OUTPUT"
          else
            echo "techniques=" >> "$GITHUB_OUTPUT"
            echo "label=全量（全部逃逸技术）" >> "$GITHUB_OUTPUT"
          fi

      - name: Check residual waiver expiry
        # 逃逸即失败（v1.0.1）：白名单是唯一例外通道，过期即视为漏洞。
        # 单独一步：配置损坏（退出码 2）或豁免过期（退出码 1）都能立刻定位，不被红队输出淹没。
        run: |
          python benchmarks/red_team/run_red_team.py --check-residual-expiry

      # 默认加载 anti_shortcut/defense/learned_rules.yaml：红队测的是「当前」防御姿态
      - name: Run red team
        id: redteam
        run: |
          # pipefail 必须显式打开：否则管道里 python 的退出码会被 tee 掩盖，
          # 「发现漏洞 -> 非 0 退出」就形同虚设，CI 会静默变绿。
          set -o pipefail
          out_dir="benchmarks/red_team/results/${{ github.run_id }}"
          args=(--workspace "$RUNNER_TEMP/red-team" --output "$out_dir" --fail-on-vulnerability)
          if [ -n "${{ steps.scope.outputs.techniques }}" ]; then
            args+=(--techniques "${{ steps.scope.outputs.techniques }}")
          fi
          echo "运行范围：${{ steps.scope.outputs.label }}"
          python benchmarks/red_team/run_red_team.py "${args[@]}" | tee "$RUNNER_TEMP/red-team.md"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 红队逃逸报告（${{ steps.scope.outputs.label }}）"
            echo
            if [ -f "$RUNNER_TEMP/red-team.md" ]; then
              cat "$RUNNER_TEMP/red-team.md"
            else
              echo "报告未生成（运行在报告阶段之前就失败了，见上方日志）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        # fork PR 的 GITHUB_TOKEN 是只读的，`gh pr comment` 会 403 把 job 弄红；
        # 这种 PR 只写 job summary（报告仍然可见），不回评论。
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/red-team.md" ]; then
            {
              echo "<!-- red-team-report -->"
              echo
              cat "$RUNNER_TEMP/red-team.md"
            } > "$RUNNER_TEMP/red-team-comment.md"
            gh pr comment "${{ github.event.number }}" --body-file "$RUNNER_TEMP/red-team-comment.md"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: red-team-report
          path: |
            benchmarks/red_team/results/${{ github.run_id }}/report.*
            benchmarks/red_team/results/report.*
          if-no-files-found: warn
