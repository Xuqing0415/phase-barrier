# 官方文档站（MkDocs -> GitHub Pages，v0.29.0）
# 构建 docs/ 站点并推送 gh-pages 分支；在仓库 Settings -> Pages 选择
# "Deploy from a branch: gh-pages / (root)" 后即可访问：
#   https://xuqing0415.github.io/phase-barrier/
name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 并发组必须是不带 ref 的静态组：main 推送与 v* 标签推送会各自触发一次本工作流，
# 而两者 github.ref 不同（refs/heads/main vs refs/tags/vX.Y.Z），按 ref 分组等于各锁各的、
# 互不可见，两次部署会同时向 gh-pages 强推并撞车（远端 "cannot lock ref" 拒绝，v0.32.0 首次复现）。
# 改为共享静态组 + cancel-in-progress: false：同组任务排队串行，后到的等先跑的推完再推；
# 两次内容来自同一 commit，重复推送结果一致无害；workflow_dispatch 手动触发同样受此锁保护。
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install mkdocs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Sync plugin status page from plugins.json
        run: python scripts/verify_plugins.py --sync-only

      - name: Check optional custom domain (docs.phase-barrier.dev, non-blocking)
        run: |
          python scripts/check_custom_domain.py --strict \
            || echo "::warning::docs.phase-barrier.dev 自定义域名未启用（可选），启用方法见 docs/custom-domain.md"

      - name: Build site
        run: mkdocs build --strict --site-dir site

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true