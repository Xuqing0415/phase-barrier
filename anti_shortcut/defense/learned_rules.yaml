note: "路径 4 学习闭环产物（人工审核后合入）。来源：benchmarks/red_team/results/learning_loop/before/report.json 里 equivalent_op/truncate_zero 的逃逸案例（case-71c21fa316bd，防线4 / file_delete）；该规则经 scripts/update_rules.py --verify-cases 反查（必须命中案例原文）后才写入。vague_phrases / weakening_words / few_shot_examples 是给防线 1 配置与防线 2 提示词的人工评审输入，不会被代码自动应用。注意：重新运行 update_rules.py --apply 会用建议里的 note 覆盖本行。"
