name: Red team

# 路径 1（v0.57.0）：用对抗性 Agent 打自己的门禁，发现真实逃逸即失败。
# 不进每次 push 的快速矩阵（一轮约 1 分钟），按周 + 手动触发即可。
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC

concurrency:
  group: red-team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-team:
    name: 红队逃逸测试（fail-on-vulnerability）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要读取 tag

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 默认加载 anti_shortcut/defense/learned_rules.yaml：红队测的是「当前」防御姿态
      - name: Run red team
        run: |
          # pipefail 必须显式打开：否则管道里 python 的退出码会被 tee 掩盖，
          # 「发现漏洞 -> 非 0 退出」就形同虚设，CI 会静默变绿。
          set -o pipefail
          python benchmarks/red_team/run_red_team.py \
            --workspace "$RUNNER_TEMP/red-team" \
            --output benchmarks/red_team/results \
            --fail-on-vulnerability | tee /tmp/red-team.md

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 红队逃逸报告"
            echo
            if [ -f /tmp/red-team.md ]; then
              cat /tmp/red-team.md
            else
              echo "报告未生成（运行在报告阶段之前就失败了，见上方日志）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: red-team-report
          path: benchmarks/red_team/results/report.*
          if-no-files-found: warn
