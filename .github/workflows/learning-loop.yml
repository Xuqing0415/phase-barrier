name: Learning loop

# 路径 4 的半自动闭环（P1，v0.60.0）：
#   红队逃逸 -> 自动分析 -> 生成 PR（含来源案例 / 规则 diff / 复测结果）-> 人工审核合并
#
# 红线保持不变：**自动只到「建议 + PR」为止**，合入由人工在 PR 上完成。
# 复测发现真实漏洞时不提 PR，改为建 issue（说明候选规则不够，需要人判断）。
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'   # 每周一 04:23 UTC（排在红队全量 03:17 之后）

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: learning-loop
  cancel-in-progress: false

jobs:
  learning-loop:
    name: 案例 -> 建议 -> PR（人工审核）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Collect cases from red team (before)
        id: collect
        run: |
          # 注意：$RUNNER_TEMP 在 workspace 之外，hashFiles() 不稳定（拿不到就返回空串，
          # 后续步骤会被静默跳过、job 依旧全绿）。这里改用 step output 显式传递。
          python benchmarks/red_team/run_red_team.py \
            --workspace "$RUNNER_TEMP/rt-before" \
            --output "$RUNNER_TEMP/rt-before" \
            --case-library "$RUNNER_TEMP/case_library.jsonl" \
            --json > "$RUNNER_TEMP/before.json" \
            || echo "::warning::红队采集步骤非 0 退出（仍尝试用已产出的案例继续）"
          if [ -s "$RUNNER_TEMP/case_library.jsonl" ]; then
            count="$(grep -c . "$RUNNER_TEMP/case_library.jsonl" || echo 0)"
            echo "has_cases=true" >> "$GITHUB_OUTPUT"
            echo "case_count=$count" >> "$GITHUB_OUTPUT"
            echo "采集到 $count 条案例"
          else
            echo "has_cases=false" >> "$GITHUB_OUTPUT"
            echo "::warning::本次红队未采集到任何案例，学习闭环无输入，跳过后续步骤"
          fi

      - name: Analyze cases and build suggestions
        if: ${{ steps.collect.outputs.has_cases == 'true' }}
        run: |
          python scripts/analyze_cases.py \
            --cases "$RUNNER_TEMP/case_library.jsonl" \
            --report "$RUNNER_TEMP/analysis.json" \
            --markdown "$RUNNER_TEMP/analysis.md" \
            --suggestions "$RUNNER_TEMP/suggestions.json" --json \
            > "$RUNNER_TEMP/analyze.json"

      - name: Apply verified suggestions (dry-run first)
        if: ${{ steps.collect.outputs.has_cases == 'true' }}
        run: |
          python scripts/update_rules.py \
            --suggestions "$RUNNER_TEMP/suggestions.json" \
            --dest anti_shortcut/defense/learned_rules.yaml \
            --verify-cases "$RUNNER_TEMP/case_library.jsonl" --json \
            > "$RUNNER_TEMP/apply_dry.json"
          python scripts/update_rules.py \
            --suggestions "$RUNNER_TEMP/suggestions.json" \
            --dest anti_shortcut/defense/learned_rules.yaml \
            --verify-cases "$RUNNER_TEMP/case_library.jsonl" --apply --json \
            > "$RUNNER_TEMP/apply.json"

      - name: Re-run red team with the candidate rules
        if: ${{ steps.collect.outputs.has_cases == 'true' }}
        id: retest
        run: |
          # --fail-on-vulnerability 是这条判定的唯一依据：不加它时脚本无论是否
          # 发现真实漏洞都返回 0，clean 会恒为 true，issue 分支永远不会走到。
          if python benchmarks/red_team/run_red_team.py \
              --workspace "$RUNNER_TEMP/rt-after" \
              --output "$RUNNER_TEMP/rt-after" \
              --fail-on-vulnerability \
              --json > "$RUNNER_TEMP/after.json"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            # 非 0 退出也会先把 JSON 打到 stdout（main() 先输出后返回 1），
            # 所以这里只能补空文件，不能直接覆盖 —— 覆盖等于把失败证据（漏洞明细）删掉。
            [ -s "$RUNNER_TEMP/after.json" ] || echo '{}' > "$RUNNER_TEMP/after.json"
          fi

      - name: Promote confirmed rules
        if: ${{ steps.retest.outputs.clean == 'true' }}
        run: |
          python scripts/update_rules.py --dest anti_shortcut/defense/learned_rules.yaml \
            --promote --confirmations-required 3 --apply --json \
            > "$RUNNER_TEMP/promote.json"

      - name: Build PR body
        if: ${{ steps.collect.outputs.has_cases == 'true' }}
        run: |
          {
            echo "## 学习闭环自动产物（需要人工审核）"
            echo
            echo "本 PR 由 `.github/workflows/learning-loop.yml` 生成：红队案例 -> 模式提取 -> 候选规则。"
            echo "**规则不会自动上线**，合并前请核对来源案例与复测结果。"
            echo
            echo "### 1. 规则 diff"
            echo '```diff'
            git diff -- anti_shortcut/defense/learned_rules.yaml || true
            echo '```'
            echo
            echo "### 2. 来源案例与提取报告"
            cat "$RUNNER_TEMP/analysis.md" 2>/dev/null || echo "(无分析报告)"
            echo
            echo "### 3. 预期拦截效果与复测结果"
            echo "- 候选规则的反查：必须命中它来自的案例原文（`--verify-cases`），否则已被丢弃。"
            echo "- 复测（加载候选规则后重跑红队全量）：**${{ steps.retest.outputs.clean == 'true' && '通过（真实漏洞 0）' || '失败（仍有漏洞，见 issue）' }}**"
            echo '```json'
            head -c 4000 "$RUNNER_TEMP/after.json" 2>/dev/null || echo '{}'
            echo '```'
            echo
            echo "### 4. 人工审核清单"
            echo "- [ ] 规则是否真的对应「被禁止的语义」，而不是误伤正常写法？"
            echo "- [ ] 来源案例是否属于同类攻击（而不是巧合命中）？"
            echo "- [ ] 复测是否在**加载本 PR 规则**的前提下通过？"
            echo "- [ ] 是否需要补充回归测试（`tests/test_behavior_chain_audit.py` 风格）？"
            echo
            echo "_自动化只到建议为止；合入后规则会进入 `observation`，经 N 次红队复测无误后由 `--promote` 升级为 `active`。_"
          } > "$RUNNER_TEMP/pr_body.md"

      - name: Open PR (or issue when the re-test still finds holes)
        if: ${{ steps.collect.outputs.has_cases == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- anti_shortcut/defense/learned_rules.yaml; then
            echo "候选规则与现有规则一致，无 PR 需要创建"
            exit 0
          fi
          run_date="$(date -u +%Y%m%d)"
          # 标签不存在时 `gh pr create --label` 会直接报错、PR 根本不会创建；
          # 这里按需创建（存在则不动），而不是用 `|| true` 把失败吞掉。
          ensure_label() {
            gh label list --limit 200 --json name --jq '.[].name' | grep -qx "$1" || \
              gh label create "$1" --color "$2" --description "$3"
          }
          ensure_label defense 1D76DB "防御门禁/防线相关"
          ensure_label learning-loop FBCA04 "学习闭环自动产物（需人工审核）"
          if [ "${{ steps.retest.outputs.clean }}" != "true" ]; then
            gh issue create \
              --title "学习闭环复测未通过：$run_date" \
              --body-file "$RUNNER_TEMP/pr_body.md" \
              --label "defense,learning-loop"
            exit 0
          fi
          branch="learning-loop/$run_date-${{ github.run_id }}"
          base="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add anti_shortcut/defense/learned_rules.yaml
          git commit -m "feat(defense): 学习闭环候选规则（$run_date，人工审核后合入）"
          git push -u origin "$branch"
          # 仓库若没开 Settings -> Actions -> General 里的
          # 「Allow GitHub Actions to create and approve pull requests」，
          # GITHUB_TOKEN 建 PR 会被拒（GraphQL: not permitted to create or approve
          # pull requests），分支却已经推上去了。这里降级为「issue + 一键建 PR 链接」，
          # 既保留人工审核环节，也不把「环境开关没开」误报成代码缺陷。
          if pr_error="$(gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "学习闭环候选规则（$run_date）" \
              --body-file "$RUNNER_TEMP/pr_body.md" \
              --label "defense,learning-loop" 2>&1)"; then
            echo "$pr_error"
            exit 0
          fi
          echo "::warning::自动建 PR 失败，降级为 issue（分支 $branch 已推送）：$pr_error"
          compare="https://github.com/${GITHUB_REPOSITORY}/compare/${base}...${branch}?expand=1"
          {
            echo
            echo "---"
            echo "### ⚠️ 自动建 PR 失败，需要人工一键创建"
            echo '```'
            echo "$pr_error"
            echo '```'
            echo "候选规则分支 \`${branch}\` 已推送。若报的是 createPullRequest 权限问题，"
            echo "可在 **Settings → Actions → General → Workflow permissions** 勾选 "
            echo "**Allow GitHub Actions to create and approve pull requests** 后重跑本 workflow。"
            echo
            echo "👉 [点击创建 PR](${compare})"
          } >> "$RUNNER_TEMP/pr_body.md"
          gh issue create \
            --title "学习闭环候选规则（$run_date，需人工开 PR）" \
            --body-file "$RUNNER_TEMP/pr_body.md" \
            --label "defense,learning-loop"

      - name: Run summary
        if: always()
        env:
          CASE_COUNT: ${{ steps.collect.outputs.case_count }}
          RETEST_CLEAN: ${{ steps.retest.outputs.clean }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 每次运行都留一份人可读摘要，避免「配了但没跑 / 跑了没产出」无从察觉。
          if git diff --quiet -- anti_shortcut/defense/learned_rules.yaml; then
            rules_state="无候选变更"
          else
            rules_state="有候选变更（已开 PR 或 issue）"
          fi
          {
            echo "## 学习闭环运行摘要"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | ${EVENT_NAME} |"
            echo "| 采集到案例 | ${CASE_COUNT:-0} 条 |"
            echo "| 复测结果 | ${RETEST_CLEAN:-未执行} |"
            echo "| 候选规则 | ${rules_state} |"
            echo "| run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  output-healthcheck:
    name: 产出健康检查（连续 2 周无候选则告警）
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Alert when the loop produced nothing for 2 weeks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 学习闭环的价值在于「持续产出候选规则」。若连续 14 天没有任何带
          # learning-loop 标签的 PR/issue，说明它要么没跑、要么跑了没产出，
          # 这时自动开 issue 提醒维护者，而不是让 job 静默全绿。
          set -euo pipefail
          gh label list --limit 200 --json name --jq '.[].name' | grep -qx "defense" || \
            gh label create "defense" --color 1D76DB --description "防御门禁/防线相关"
          gh label list --limit 200 --json name --jq '.[].name' | grep -qx "learning-loop" || \
            gh label create "learning-loop" --color FBCA04 --description "学习闭环自动产物（需人工审核）"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=learning-loop&state=all&sort=created&direction=desc&per_page=1" --jq '.[0].created_at // ""')"
          now="$(date -u +%s)"
          if [ -n "$latest" ]; then
            age_days=$(( (now - $(date -u -d "$latest" +%s)) / 86400 ))
          else
            age_days=999
          fi
          echo "最近一次学习闭环产出：${latest:-无}（${age_days} 天前）"
          if [ "$age_days" -lt 14 ]; then
            echo "未超过 14 天，无需告警"
            exit 0
          fi
          open_alerts="$(gh issue list --state open --label learning-loop --json title \
            --jq '[.[] | select(.title | startswith("学习闭环连续 2 周无产出"))] | length')"
          if [ "$open_alerts" != "0" ]; then
            echo "已有未关闭的同类告警，跳过"
            exit 0
          fi
          gh issue create \
            --title "学习闭环连续 2 周无产出（截至 $(date -u +%Y-%m-%d)）" \
            --label "defense,learning-loop" \
            --body "$(cat <<'BODY'
          学习闭环（`.github/workflows/learning-loop.yml`）已连续 14 天没有产出任何候选规则 PR/issue。

          请按顺序排查：

          1. 该 workflow 近期是否真的在跑（Actions -> Learning loop；schedule 为每周一 04:23 UTC）。
          2. 运行摘要（job summary）里「采集到案例」是否为 0——红队没采到案例则闭环无输入。
          3. 若采集正常但没有候选，说明现有规则已覆盖当前逃逸技术（属于正常稳态），
             可关闭本 issue 或考虑扩充红队逃逸技术库。
          4. 若是权限问题（自动建 PR 被拒），确认 Settings -> Actions -> General 已勾选
             「Allow GitHub Actions to create and approve pull requests」。
          BODY
          )"
